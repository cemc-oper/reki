api_version: reki.catalog/v1
datasets:
  - id: cma_gfs_gmf
    aliases: [CMA-GFS, cma_gfs]
    source:
      name: local
      args: [cma_gfs_gmf/grib2/orig]
    metadata:
      display_name: CMA-GFS
      legacy_data_dir: /g3/COMMONDATA/OPER/CEMC/GFS_GMF/Prod-grib/{start_time_label}/ORIG
      legacy_file_name_template: gmf.gra.{start_time_label}{forecast_hour_label}.grb2
