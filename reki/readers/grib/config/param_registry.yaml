# GRIB2 要素注册表。约束规范见同目录 param_registry_spec.md，请勿违反编号规则。
# 本文件由 cemc-param-db 从要素数据库导出（python -m cemc_param_db export），请勿手工编辑。
- key:
    discipline: 0
    category: 0
    number: 0
  name: t
  wgrib2_name: TMP
  unit: K
  description: Temperature
  description_cn: 温度
  params:
  - name: t2m
    when:
      first_level_type: 103
      first_level: 2
    typeOfLevel: heightAboveGround
    level: 2
    description: Temperature at 2 meters height
    description_cn: 2米温度
  - name: ts
    aliases:
    - tsfc
    when:
      first_level_type: 1
    typeOfLevel: surface
    description: Surface temperature
    description_cn: 地面温度
  - name: st
    when:
      first_level_type: 106
    typeOfLevel: depthBelowLandLayer
    description: Soil temperature
    description_cn: 土壤温度
  - name: st(0-10)
    when:
      first_level_type: 106
      first_level: 0
      second_level_type: 106
      second_level: 0.1
    typeOfLevel: depthBelowLandLayer
    description_cn: 0-10cm土壤温度
  - name: st(10-40)
    when:
      first_level_type: 106
      first_level: 0.1
      second_level_type: 106
      second_level: 0.4
    typeOfLevel: depthBelowLandLayer
    description_cn: 10-40cm土壤温度
  - name: st(40-100)
    when:
      first_level_type: 106
      first_level: 0.4
      second_level_type: 106
      second_level: 1
    typeOfLevel: depthBelowLandLayer
    description_cn: 40-100cm土壤温度
  - name: st(100-200)
    when:
      first_level_type: 106
      first_level: 1
      second_level_type: 106
      second_level: 2
    typeOfLevel: depthBelowLandLayer
    description_cn: 100-200cm土壤温度
