  - id: cma_reps
    aliases: [CMA-REPS]
    source:
      name: local
      args: [cma_reps/grib2/orig]
    metadata:
      display_name: CMA-REPS
  # Service bindings deliberately carry no credentials.  ``cmadaas`` is lazy,
  # so catalog resolution and recipe loading stay offline; credentials are
  # supplied by the runtime CMADaaS client configuration.
  - id: cma_gfs_gmf_cmadaas
    aliases: [CMA-GFS-CMADaaS, CMA-GFS-FORECAST-CMADaaS]
    source:
      name: cmadaas
      kwargs:
        kind: model_grid
        # The nuwe-cmadaas CMA-GFS product reference identifies this code
        # as CMA-GFS 0.25-degree global forecast data.  A T5-09 fixed-cycle
        # MUSIC request was also successful; HIGH_EC names a different model.
        data_code: NAFP_FOR_FTM_GRAPES_GFS_25KM_GLB
    metadata:
      display_name: CMA-GFS forecast CMADaaS
      provider: cmadaas-remote
      product_type: deterministic_forecast
      limitations: "Product availability and grid version are service dependent."
      data_code_evidence:
        status: confirmed
        source: doc/ref/cmadaas-cemc-data.md CMA-GFS forecast product table
        reviewed_on: '2026-08-31'
  - id: cma_gfs_gmf_analysis_cmadaas
    aliases: [CMA-GFS-ANALYSIS-CMADaaS]
    source:
