name: ci-build

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python }}
      - name: Sync test environment
        # The local sources are available in the development workspace, but
        # not in this standalone GitHub checkout. Use published metadata in CI.
        run: uv sync --group test --no-sources
      - name: Run tests
        run: uv run --no-sources pytest tests -v --tb=short
      - name: Build
        run: uv build --no-sources

  docs:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install dependencies
        run: |
            uv pip install -r doc/requirements.txt
            uv pip install .
      - name: Build and check docs
        run: uv run --no-sync make -C doc check SPHINXOPTS="-W --keep-going"
