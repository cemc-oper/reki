version: 2

sphinx:
  configuration: doc/source/conf.py

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    # Pre-download frozen fixtures into the repository-local cache used by
    # executed notebooks (same policy as `make -C doc data`).
    pre_build:
      - make -C doc data

python:
  install:
    - requirements: doc/requirements.txt
    - method: pip
      path: .
